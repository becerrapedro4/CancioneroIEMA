<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Stage - Presentador</title>
<style>
/* ===== RESET Y FONDO ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff}

/* ===== ORBS (fondo animado) ===== */
.orbs{position:fixed;inset:0;pointer-events:none;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(90px);animation:drift 18s ease-in-out infinite}
.orb1{width:70vw;height:70vw;background:#F5A623;opacity:.18;top:-15%;left:-15%;animation-delay:0s}
.orb2{width:50vw;height:50vw;background:#F5A623;opacity:.10;bottom:-10%;right:-10%;animation-delay:-7s}
.orb3{width:35vw;height:35vw;background:#fff;opacity:.04;top:40%;left:55%;animation-delay:-13s}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(4%,6%) scale(1.05)}66%{transform:translate(-3%,3%) scale(.97)}}

/* ===== LAYOUT ===== */
.wrap{position:fixed;inset:0;z-index:1;display:flex}
.stage{
    position:relative;flex:1;min-width:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:4vh 6vw;
    text-align:center;
    transition:opacity .4s;
}
.stage.hidden{opacity:0;pointer-events:none}

/* ===== TÍTULO ===== */
.stage .song-title{
    font-family:system-ui,-apple-system,sans-serif;
    font-weight:500;
    line-height:1.2;
    text-transform:uppercase;
    letter-spacing:.04em;
    margin-bottom:1.5vh;
    opacity:.5;
    font-size:clamp(0.8rem,1.8vw,1.8rem);
}
.stage .song-title.hidden{display:none}

/* ===== ESTROFA ACTUAL ===== */
.stage .current{
    font-family:system-ui,-apple-system,sans-serif;
    font-weight:600;
    line-height:1.3;
    text-transform:uppercase;
    letter-spacing:.02em;
    white-space:pre-wrap;
    max-width:94vw;
    padding:1vh 2vw;
    min-height:20vh;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    transition:opacity .2s,transform .2s;
    font-size:clamp(3rem,8vw,8rem);
}
.stage .current.out{opacity:0;transform:translateY(14px)}
.stage .current.in{animation:lyricIn .35s ease forwards}

/* ===== SIGUIENTE ESTROFA ===== */
.stage .next{
    font-family:system-ui,-apple-system,sans-serif;
    font-weight:400;
    line-height:1.3;
    text-transform:uppercase;
    letter-spacing:.02em;
    white-space:pre-wrap;
    max-width:80vw;
    padding-top:2vh;
    margin-top:2vh;
    border-top:1px solid rgba(255,255,255,0.08);
    color:rgba(255,255,255,0.5);
    font-size:clamp(2.5rem,7vw,7rem);
    min-height:10vh;
}
.stage .next.empty{
    color:rgba(255,255,255,0.15);
    font-style:italic;
    font-weight:300;
    border-top-color:transparent;
}
.stage .next.hidden{display:none}

@keyframes lyricIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}

/* ===== REFERENCIA ===== */
.stage .ref-info{
    position:absolute;bottom:5vh;left:50%;transform:translateX(-50%);
    font-family:system-ui,-apple-system,sans-serif;
    font-weight:400;
    color:rgba(255,255,255,.45);
    letter-spacing:.04em;
    text-align:center;
    max-width:80vw;
    transition:opacity .3s;
}
.stage .ref-info.hidden{opacity:0}

/* ===== PANEL DE LA LISTA (modos "lista") ===== */
.panel-list{
    width:24vw;min-width:230px;max-width:380px;flex-shrink:0;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-right:1px solid rgba(255,255,255,.08);
    display:flex;flex-direction:column;overflow:hidden;
}
body:not(.split) .panel-list{display:none}
.list-head{padding:2.4vh 1.3vw;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.list-label{font-size:clamp(.6rem,.8vw,.95rem);letter-spacing:3px;text-transform:uppercase;color:#F5A623}
.list-sub{font-size:clamp(.6rem,.75vw,.85rem);color:rgba(255,255,255,.35);margin-top:4px}
.list-songs{flex:1;overflow-y:auto;padding:1vh .7vw}
.list-item{display:flex;align-items:center;gap:.7vw;padding:1vh .8vw;border-radius:8px;border:1px solid transparent;transition:background .15s,border-color .15s}
.list-item.active{background:rgba(245,166,35,.12);border-color:rgba(245,166,35,.3)}
.li-num{font-size:clamp(.55rem,.7vw,.8rem);color:rgba(255,255,255,.3);min-width:1.8em;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.list-item.active .li-num{color:#F5A623;font-weight:600}
.li-title{flex:1;min-width:0;font-family:system-ui,-apple-system,sans-serif;font-size:clamp(.65rem,.95vw,1.1rem);text-transform:uppercase;letter-spacing:.02em;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item.active .li-title{color:#F5A623;font-weight:600}
.li-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.li-dot.st-done{background:rgba(255,255,255,.2)}
.li-dot.st-cur{background:#00ff88;box-shadow:0 0 8px #00ff88}
.li-dot.st-pend{background:transparent;border:1.5px solid rgba(255,255,255,.15)}
.list-empty{padding:2vh 1vw;color:rgba(255,255,255,.25);font-size:.85rem;text-align:center}
body.split .current{max-width:92%}
body.split .next{max-width:92%}

/* En pantallas chicas el panel va arriba */
@media(max-width:720px){
    .wrap{flex-direction:column}
    .panel-list{width:100%;max-width:none;min-width:0;height:30vh;border-right:none;border-bottom:1px solid rgba(255,255,255,.08)}
    .list-head{padding:1.6vh 3vw}
}

/* ===== MENSAJES (notificaciones) ===== */
#messages{
    position:fixed;bottom:2vh;right:2vw;
    background:rgba(0,0,0,0.7);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:12px;
    padding:12px 18px;
    max-width:40vw;
    max-height:30vh;
    overflow-y:auto;
    font-size:0.9rem;
    color:rgba(255,255,255,0.7);
    display:none;
    transition:opacity 0.3s;
    z-index:10;
}
#messages.visible{display:block}
.msg-item{padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:0.85rem}
.msg-time{color:rgba(255,255,255,0.25);font-size:0.7rem;margin-right:8px}
#info{
    position:fixed;bottom:2vh;left:2vw;
    font-size:0.7rem;
    color:rgba(255,255,255,0.15);
    letter-spacing:1px;
    z-index:10;
}
#status-dot{
    width:10px;height:10px;border-radius:50%;
    display:inline-block;margin-right:6px;
}
.on{background:#00ff88;box-shadow:0 0 12px #00ff88}
.off{background:#ff2244;box-shadow:0 0 8px rgba(255,34,68,0.4)}
</style>
</head>
<body>

<div class="orbs">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
</div>

<div class="wrap">
    <!-- LISTA (solo en los modos que la incluyen) -->
    <aside class="panel-list" id="panel-list">
        <div class="list-head">
            <div class="list-label" id="list-label">Lista de presentación</div>
            <div class="list-sub" id="list-sub"></div>
        </div>
        <div class="list-songs" id="list-songs"></div>
    </aside>

    <main class="stage hidden" id="stage">
        <div class="song-title hidden" id="song-title"></div>
        <div class="current" id="current"></div>
        <div class="next" id="next"></div>
        <div class="ref-info hidden" id="ref-info"></div>
    </main>
</div>

<div id="messages"></div>
<div id="info">Sala: <span id="room-name">—</span> <span id="status-dot" class="off"></span> <span id="info-mode"></span> <span id="hl-info"></span></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/rooms-index.js"></script>
<script src="js/holyrics-api.js"></script>

<script>
// ============================================================
// 🔥 INICIALIZACIÓN DE FIREBASE (ver js/firebase-init.js)
// ============================================================
const db = window.db;

// ============================================================
// PARÁMETROS DE URL
// ============================================================
const params = new URLSearchParams(location.search);
const room = params.get('room') || 'iglesia';
const offset = parseInt(params.get('offset')) || 0;
document.getElementById('room-name').textContent = room;

// ============================================================
// MODOS DEL STAGE (los elige el admin; acá solo se aplican)
// ============================================================
const MODES = {
    'list-next':   { layout: 'list', next: true,  label: 'Lista + letra actual y siguiente' },
    'lyrics-next': { layout: 'full', next: true,  label: 'Solo letra actual y siguiente' },
    'list':        { layout: 'list', next: false, label: 'Lista + letra actual' }
};
const forcedMode = params.get('mode');   // ?mode=... fuerza el layout e ignora Firebase
let mode = MODES[forcedMode] ? forcedMode : (MODES[localStorage.getItem('stage_mode')] ? localStorage.getItem('stage_mode') : 'lyrics-next');
let lastData = null;
let lastQueueKey = '';

// ============================================================
// HOLYRICS (ver js/holyrics-api.js)
// La conexión la guarda el admin en `rooms/<sala>/holyrics`. Cuando está activa y hay una
// lectura fresca, esta pantalla muestra lo que Holyrics tiene puesto en vez de esperar a
// que el presentador mande la estrofa. La lectura llega publicada en
// `rooms/<sala>/holyrics/now` —la escribe el admin abierto en la PC (js/holyrics-live.js)
// o el puente— o, si este navegador alcanza la PC, directo del API.
// ============================================================
let hlCfg = null;        // la conexión de la sala
let hlNow = null;        // lo último que publicó el puente
let hlDirecto = null;    // última lectura directa del API de Holyrics
let hlPintando = false;  // la pantalla está mostrando Holyrics ahora mismo
let hlFallos = 0;        // lecturas directas seguidas que fallaron

function currentMode() { return MODES[mode] || MODES['lyrics-next']; }

// ============================================================
// ELEMENTOS
// ============================================================
const stageEl = document.getElementById('stage');
const titleEl = document.getElementById('song-title');
const currentEl = document.getElementById('current');
const nextEl = document.getElementById('next');
const refInfo = document.getElementById('ref-info');
const messagesEl = document.getElementById('messages');
const dot = document.getElementById('status-dot');
const panelList = document.getElementById('panel-list');
const listSongsEl = document.getElementById('list-songs');

let messageTimer = null;

// ============================================================
// HELPER
// ============================================================
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// ============================================================
// PINTAR LA LETRA (el mismo trabajo para las dos fuentes)
// La letra que se muestra puede venir del presentador (rooms/<sala>/currentSong) o de
// Holyrics; el tamaño, la animación y el preset se aplican igual en los dos casos.
// ============================================================
function pintarLetra(actual, siguiente, conSiguiente) {
    actual = actual || '';
    let fontSize = 'clamp(3rem, 8vw, 8rem)';
    if (actual.length > 60) fontSize = 'clamp(2.2rem, 5vw, 5rem)';
    else if (actual.length > 40) fontSize = 'clamp(2.5rem, 6vw, 6rem)';
    currentEl.style.fontSize = fontSize;

    currentEl.classList.remove('in', 'out');
    currentEl.classList.add('out');
    setTimeout(() => {
        currentEl.textContent = actual || ' ';
        currentEl.classList.remove('out');
        void currentEl.offsetWidth;
        currentEl.classList.add('in');
    }, 180);

    // La siguiente la pide el preset elegido en el admin (los 3 presets se diferencian
    // justamente en esto).
    if (siguiente && conSiguiente) {
        nextEl.textContent = siguiente;
        nextEl.classList.remove('empty', 'hidden');
        let f = 'clamp(2.5rem, 7vw, 7rem)';
        if (siguiente.length > 60) f = 'clamp(1.8rem, 4.5vw, 4.5rem)';
        else if (siguiente.length > 40) f = 'clamp(2rem, 5.5vw, 5.5rem)';
        nextEl.style.fontSize = f;
    } else {
        nextEl.textContent = '';
        nextEl.classList.add('hidden');
    }
}

// ============================================================
// APLICAR EL MODO
// ============================================================
function applyMode() {
    const m = currentMode();
    document.body.classList.toggle('split', m.layout === 'list');
    panelList.style.display = m.layout === 'list' ? '' : 'none';
    document.getElementById('info-mode').textContent = '· ' + m.label;
    render(lastData);
}

// ============================================================
// LISTA DE LA PRESENTACIÓN
// ============================================================
function renderList(data) {
    const queue = (data && data.queue) || [];
    const qIdx = (data && data.queueIdx) || 0;
    const key = JSON.stringify(queue) + '|' + qIdx;
    if (key === lastQueueKey) return;
    lastQueueKey = key;

    if (!queue.length) {
        document.getElementById('list-label').textContent = 'Lista de presentación';
        document.getElementById('list-sub').textContent = '';
        listSongsEl.innerHTML = '<div class="list-empty">Sin lista activa</div>';
        return;
    }

    document.getElementById('list-label').textContent = queue.length > 1 ? 'Lista de presentación' : 'Canción';
    document.getElementById('list-sub').textContent = queue.length > 1 ? `Canción ${qIdx + 1} de ${queue.length}` : '';

    listSongsEl.innerHTML = queue.map((s, i) => {
        const status = i < qIdx ? 'st-done' : i === qIdx ? 'st-cur' : 'st-pend';
        return `<div class="list-item${i === qIdx ? ' active' : ''}">
            <span class="li-num">${i + 1}</span>
            <span class="li-title">${esc(s.t || 'Sin título')}</span>
            <span class="li-dot ${status}"></span>
        </div>`;
    }).join('');

    const activeEl = listSongsEl.querySelector('.list-item.active');
    if (activeEl) activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// ============================================================
// MOSTRAR LA CANCIÓN (con corrección de desfase)
// ============================================================
// Lo último que se pintó. La pantalla se repasa cada pocos segundos (ver
// refrescarHolyrics), así que si nada cambió no se repinta: si no, la letra reiniciaría
// su animación todo el tiempo.
let firmaPintada = '';
function sinCambios(firma) {
    if (firma === firmaPintada) return true;
    firmaPintada = firma;
    return false;
}
function ocultar() {
    if (sinCambios('oculto')) return;
    stageEl.classList.add('hidden');
    dot.className = 'off';
}

function render(data) {
    // Un blanco/stop del presentador manda siempre: es una orden de apagar la pantalla,
    // también cuando la letra la está mandando Holyrics.
    if (data && (data.blank || data.stop)) {
        hlPintando = false;
        ocultar();
        return;
    }

    // Si la sala tiene una conexión de Holyrics viva, la pantalla muestra ESO. La conexión
    // la guarda el admin en rooms/<sala>/holyrics (ver js/holyrics-api.js).
    const hl = hlFuente();
    if (hl) {
        pintarHolyrics(hl);
        return;
    }
    hlPintando = false;

    if (!data) { ocultar(); return; }

    let estrofas = data.estrofas || [data.estrofa];
    let idx = data.idx || 0;

    // 🔥 CORRECCIÓN DE DESFASE AUTOMÁTICA
    let corrected = false;
    if (estrofas.length > 1 && idx > 0 && idx < estrofas.length) {
        const expected = data.estrofa || '';
        const actual = estrofas[idx] || '';
        if (expected && actual && expected !== actual) {
            const prevActual = estrofas[idx - 1] || '';
            if (expected === prevActual) {
                idx = idx - 1;
                corrected = true;
            }
        }
    }
    // Aplicar offset manual
    idx = idx + offset;
    if (idx < 0) idx = 0;
    if (idx >= estrofas.length) idx = estrofas.length - 1;

    if (corrected) {
        console.log('✅ Desfase corregido automáticamente. Nuevo idx:', idx);
    }

    const currentText = estrofas[idx] || data.estrofa || '';
    const nextText = (idx + 1 < estrofas.length) ? estrofas[idx + 1] : '';

    if (sinCambios(['app', data.titulo || '', currentText, nextText,
                    data.showTitle !== false, data.showRef !== false,
                    data.reference || data.citation || '', mode].join('|'))) return;

    // ── TÍTULO ──
    const showTitle = data.showTitle !== false && data.titulo && data.titulo.trim();
    if (showTitle) {
        titleEl.textContent = data.titulo;
        titleEl.classList.remove('hidden');
    } else {
        titleEl.classList.add('hidden');
    }

    // ── LETRA (actual y, según el preset, la siguiente) ──
    pintarLetra(currentText, nextText, currentMode().next);

    // ── REFERENCIA ──
    const showRef = data.showRef !== false;
    const ref = data.reference || data.citation || '';
    if (ref && showRef) {
        refInfo.textContent = ref;
        refInfo.classList.remove('hidden');
    } else {
        refInfo.classList.add('hidden');
    }

    // ── LISTA (solo en los modos que la incluyen) ──
    if (currentMode().layout === 'list') renderList(data);

    stageEl.classList.remove('hidden');
    dot.className = 'on';
}

// ============================================================
// ESCUCHAR CANCIÓN
// ============================================================
db.ref(`rooms/${room}/currentSong`).on('value', (snap) => {
    lastData = snap.val();
    render(lastData);
});

// ============================================================
// ESCUCHAR EL MODO ELEGIDO EN EL ADMIN
// ============================================================
if (!MODES[forcedMode]) {
    db.ref(`rooms/${room}/stageMode`).on('value', (snap) => {
        const v = snap.val();
        if (v && MODES[v] && v !== mode) {
            mode = v;
            localStorage.setItem('stage_mode', v);
            applyMode();
        }
    });
}

// ============================================================
// ESCUCHAR MENSAJES
// ============================================================
db.ref(`rooms/${room}/messages`).on('child_added', (snap) => {
    const msg = snap.val();
    if (!msg) return;
    const text = msg.texto || msg;
    const item = document.createElement('div');
    item.className = 'msg-item';
    const time = new Date(msg.timestamp || Date.now()).toLocaleTimeString();
    item.innerHTML = `<span class="msg-time">${esc(time)}</span>${esc(text)}`;
    messagesEl.appendChild(item);
    messagesEl.classList.add('visible');
    clearTimeout(messageTimer);
    messageTimer = setTimeout(() => {
        messagesEl.classList.remove('visible');
    }, 5000);
});

// ============================================================
// PRESENCIA: esta sala tiene un stage conectado
// (lo lee el admin para saber a qué sala mandar los mensajes)
// ============================================================
if (window.RoomsIndex) {
    window.RoomsIndex.track(room, 'stage', () => ({
        mode: currentMode().label,
        song: (lastData && lastData.titulo) || ''
    }));
}

// ============================================================
// HOLYRICS: FUNCIONES
// ============================================================
function hlAPI() { return window.HolyricsAPI || null; }

// De dónde sale la letra: lo que publicó el puente, o una lectura directa del API. null
// cuando la sala no tiene conexión o lo que hay ya es viejo.
function hlFuente() {
    const H = hlAPI();
    if (!H || !hlCfg || !hlCfg.activo) return null;
    if (H.viva(hlNow)) return hlNow;
    if (H.viva(hlDirecto)) return hlDirecto;
    return null;
}

// La pantalla cuando la letra viene de Holyrics: su título, la diapositiva que se está
// viendo, la siguiente (según el preset) y la numeración abajo.
function pintarHolyrics(f) {
    const H = hlAPI();
    if (!H) return;
    const conSiguiente = currentMode().next;
    const t = H.textos(f, conSiguiente);
    if (sinCambios(['hl', t.titulo, t.actual, t.siguiente, f.indice || 0, f.total || 0, mode].join('|'))) return;

    // El "mostrar título" y "mostrar referencia" los elige el presentador en su panel:
    // si no dijo nada, se muestran (es lo útil para el equipo arriba del escenario).
    const verTitulo = !lastData || lastData.showTitle !== false;
    if (t.titulo && verTitulo) {
        titleEl.textContent = t.titulo;
        titleEl.classList.remove('hidden');
    } else {
        titleEl.classList.add('hidden');
    }

    pintarLetra(t.actual, t.siguiente, conSiguiente);

    const verRef = !lastData || lastData.showRef !== false;
    if (verRef && f.total) {
        refInfo.textContent = `${(f.indice || 0) + 1} / ${f.total} · Holyrics`;
        refInfo.classList.remove('hidden');
    } else {
        refInfo.classList.add('hidden');
    }

    if (currentMode().layout === 'list') pintarListaHolyrics(f);

    hlPintando = true;
    stageEl.classList.remove('hidden');
    dot.className = 'on';
}

// La lista del costado, cuando la letra viene de Holyrics: son las diapositivas de lo que
// Holyrics tiene cargado, con la que se está viendo marcada.
function pintarListaHolyrics(f) {
    const items = (f && f.items) || [];
    const i = (f && f.indice) || 0;
    const key = 'hl|' + items.length + '|' + i + '|' + ((f && f.titulo) || '');
    if (key === lastQueueKey) return;
    lastQueueKey = key;

    document.getElementById('list-label').textContent = 'Presentación en Holyrics';
    document.getElementById('list-sub').textContent = items.length > 1 ? `Diapositiva ${i + 1} de ${items.length}` : '';
    listSongsEl.innerHTML = items.length ? items.map((t, k) => {
        const estado = k < i ? 'st-done' : k === i ? 'st-cur' : 'st-pend';
        return `<div class="list-item${k === i ? ' active' : ''}">
            <span class="li-num">${k + 1}</span>
            <span class="li-title">${esc(t || '—')}</span>
            <span class="li-dot ${estado}"></span>
        </div>`;
    }).join('') : '<div class="list-empty">Holyrics no tiene nada en pantalla</div>';

    const activeEl = listSongsEl.querySelector('.list-item.active');
    if (activeEl) activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// El aviso de abajo a la izquierda, al lado de la sala y el modo.
function barraHolyrics() {
    const el = document.getElementById('hl-info');
    if (!el) return;
    if (!hlCfg || !hlCfg.activo) { el.textContent = ''; return; }
    const H = hlAPI();
    // Quién lo publicó: el admin abierto en la PC (ver js/holyrics-live.js) o el puente.
    if (H && H.viva(hlNow)) { el.textContent = '· 🎦 Holyrics (' + (hlNow.por === 'admin' ? 'admin' : 'puente') + ')'; return; }
    if (H && H.viva(hlDirecto)) { el.textContent = '· 🎦 Holyrics (directo)'; return; }
    // El motivo largo no va en la pantalla que se proyecta: se ve en el admin.
    el.textContent = '· 🎦 Holyrics (sin lectura)';
}

// Lectura directa del API, solo cuando nadie publicó (si hay publicación fresca, manda esa).
// Tras unos fallos seguidos se prueba mucho menos seguido: no tiene sentido insistir cada
// pocos segundos contra una PC que este navegador no alcanza.
const HL_CADA = 4000, HL_CADA_TRAS_FALLAR = 30000;
let hlUltimoIntento = 0;

async function leerHolyricsDirecto() {
    const H = hlAPI();
    if (!H || !hlCfg || !hlCfg.activo || H.viva(hlNow)) return;
    // Desde una página que no alcanza la PC (la publicada, en https) no se intenta: ahí el
    // que publica es el admin abierto en la PC o el puente.
    if (!H.alcanzableDesdeAca(hlCfg)) return;
    if (hlFallos > 2 && (Date.now() - hlUltimoIntento) < HL_CADA_TRAS_FALLAR) return;
    hlUltimoIntento = Date.now();
    const r = await H.enPantalla(hlCfg);
    if (r.ok) {
        hlFallos = 0;
        hlDirecto = Object.assign({ ts: Date.now() }, r);
    } else {
        hlFallos++;
        hlDirecto = null;
    }
}

async function refrescarHolyrics() {
    await leerHolyricsDirecto();
    barraHolyrics();
    // Se repasa siempre: si la lectura cambió se ve, y si se puso vieja (se cortó el puente)
    // la pantalla vuelve a lo que manda el presentador. Si nada cambió, render no repinta.
    render(lastData);
}

// ============================================================
// HOLYRICS: ESCUCHAR LA CONEXIÓN DE LA SALA
// ============================================================
db.ref(`rooms/${room}/holyrics`).on('value', (snap) => {
    const H = hlAPI();
    hlCfg = H ? H.deSala(snap.val()) : null;
    hlDirecto = null;
    hlFallos = 0;
    barraHolyrics();
    render(lastData);
});
db.ref(`rooms/${room}/holyrics/now`).on('value', (snap) => {
    const n = snap.val();
    hlNow = (n && n.ts) ? n : null;
    barraHolyrics();
    render(lastData);
});
setInterval(refrescarHolyrics, HL_CADA);
barraHolyrics();

// ============================================================
// HOLYRICS: EL PEDIDO
// Esta pantalla está a la vista (es la que se proyecta), así que es la que puede
// despertar al que publica: cada HL_PEDIDO_CADA ms escribe `rooms/<sala>/holyrics/pedido`,
// y el publicador (el admin oculto o el puente) corre un ciclo al verlo. Es lo que mantiene
// la letra al día cuando la pestaña del admin está de fondo: ahí el navegador frena sus
// temporizadores, pero un evento de red llega igual (ver js/holyrics-live.js).
// ============================================================
const HL_PEDIDO_CADA = 2000;
function pedirHolyrics() {
    if (!hlCfg || !hlCfg.activo) return;
    db.ref(`rooms/${room}/holyrics/pedido`).set(Date.now());
}
setInterval(pedirHolyrics, HL_PEDIDO_CADA);
// Al volver a la vista se pide enseguida, sin esperar al próximo latido.
document.addEventListener('visibilitychange', () => { if (!document.hidden) pedirHolyrics(); });
pedirHolyrics();

// ============================================================
// ARRANQUE
// ============================================================
applyMode();
console.log('🎤 Stage iniciado. Sala:', room, '· Modo:', mode);
console.log('💡 Si ves desfase, usa ?offset=-1 en la URL');
</script>
