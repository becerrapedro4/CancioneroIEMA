<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage - Presentador</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #f0ede8;
            font-family: 'DM Sans', system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2vh 2vw;
        }
        #title {
            font-size: clamp(1.8rem, 4vw, 4rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 2vh;
            opacity: 0.8;
            text-align: center;
            text-transform: uppercase;
        }
        #current {
            font-size: clamp(3rem, 8vw, 8rem);
            font-weight: 600;
            line-height: 1.3;
            text-align: center;
            white-space: pre-wrap;
            max-width: 90vw;
            padding: 2vh 2vw;
            background: rgba(255,255,255,0.04);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(10px);
            min-height: 20vh;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        #next {
            font-size: clamp(1.2rem, 2.5vw, 2.5rem);
            font-weight: 400;
            color: rgba(255,255,255,0.3);
            text-align: center;
            white-space: pre-wrap;
            margin-top: 3vh;
            padding: 1.5vh 2vw;
            border-top: 1px solid rgba(255,255,255,0.06);
            max-width: 80vw;
            min-height: 8vh;
        }
        #messages {
            position: fixed;
            bottom: 2vh;
            right: 2vw;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 12px 18px;
            max-width: 40vw;
            max-height: 30vh;
            overflow-y: auto;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
            display: none;
            transition: opacity 0.3s;
            z-index: 10;
        }
        #messages.visible { display: block; }
        .msg-item {
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 0.85rem;
        }
        .msg-time {
            color: rgba(255,255,255,0.25);
            font-size: 0.7rem;
            margin-right: 8px;
        }
        #info {
            position: fixed;
            bottom: 2vh;
            left: 2vw;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.15);
            letter-spacing: 1px;
        }
        #status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .on { background: #00ff88; box-shadow: 0 0 12px #00ff88; }
        .off { background: #ff2244; box-shadow: 0 0 8px rgba(255,34,68,0.4); }
    </style>
</head>
<body>
    <div id="title">—</div>
    <div id="current">Esperando datos...</div>
    <div id="next">⬇ Siguiente</div>
    <div id="messages"></div>
    <div id="info">Sala: <span id="room-name">—</span> <span id="status-dot" class="off"></span></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script>
        firebase.initializeApp({
            apiKey: "AIzaSyDcstZpX0ji9HAdK9POboYQPTMcc6utC1E",
            authDomain: "browser-songs.firebaseapp.com",
            databaseURL: "https://browser-songs-default-rtdb.firebaseio.com",
            projectId: "browser-songs"
        });
        const db = firebase.database();

        const params = new URLSearchParams(location.search);
        const room = params.get('room') || 'iglesia';
        document.getElementById('room-name').textContent = room;

        const titleEl = document.getElementById('title');
        const currentEl = document.getElementById('current');
        const nextEl = document.getElementById('next');
        const messagesEl = document.getElementById('messages');
        const dot = document.getElementById('status-dot');

        let currentData = null;
        let messageTimer = null;

        db.ref(`rooms/${room}/currentSong`).on('value', (snap) => {
            const data = snap.val();
            if (!data || data.blank || data.stop) {
                titleEl.textContent = '—';
                currentEl.textContent = 'Esperando canción...';
                nextEl.textContent = '⬇ Siguiente';
                dot.className = 'off';
                return;
            }

            currentData = data;
            dot.className = 'on';

            titleEl.textContent = data.titulo || 'Sin título';

            const estrofas = data.estrofas || [data.estrofa];
            const idx = data.idx || 0;
            const currentText = estrofas[idx] || data.estrofa || '';
            currentEl.textContent = currentText;

            if (idx + 1 < estrofas.length) {
                nextEl.textContent = estrofas[idx + 1] || '⬇ Siguiente';
            } else {
                nextEl.textContent = '⬇ Fin de la canción';
            }
        });

        db.ref(`rooms/${room}/messages`).on('child_added', (snap) => {
            const msg = snap.val();
            if (!msg) return;
            showMessage(msg.texto || msg);
        });

        function showMessage(text) {
            const item = document.createElement('div');
            item.className = 'msg-item';
            const time = new Date().toLocaleTimeString();
            item.innerHTML = `<span class="msg-time">${time}</span>${text}`;
            messagesEl.appendChild(item);
            messagesEl.classList.add('visible');
            clearTimeout(messageTimer);
            messageTimer = setTimeout(() => {
                messagesEl.classList.remove('visible');
            }, 5000);
        }
    </script>
</body>
</html>
